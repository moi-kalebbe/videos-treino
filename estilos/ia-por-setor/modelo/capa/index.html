<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Capa · IA por Setor 01</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/fonts/inter-700.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-800.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); }
      /* Zona segura: y=285–1635 (recorte 4:5 do feed) */
      :root { --papel: #f6f4ef; --tinta: #0e1424; --cinza: #5b6378; --lima: #d7ff3a; --verm: #e5484d; --verde: #0f7a37; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; color: var(--tinta); }
      .clip { position: absolute; inset: 0; }
      .fundo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .veu { position: absolute; inset: 0; background: linear-gradient(180deg, #0e142499 0%, #0e142433 40%, #0e1424b3 100%); }
      .serie { position: absolute; left: 70px; top: 320px; padding: 12px 20px; border-radius: 14px; background: var(--tinta); color: #fff; font: 700 30px "Inter"; letter-spacing: 0.12em; }
      .serie b { color: var(--lima); }
      #marca { position: absolute; right: 70px; top: 315px; width: 130px; }
      .card { position: absolute; left: 60px; right: 60px; top: 450px; padding: 46px 48px; border-radius: 40px; background: var(--papel); box-shadow: 0 40px 100px #000a; }
      .card h1 { font: 800 104px/1.0 "Inter"; letter-spacing: -0.045em; }
      .card h1 em { font: italic 400 120px "Instrument Serif"; background: var(--lima); padding: 0 14px; border-radius: 14px; }
      .card p { margin-top: 26px; font: 700 40px/1.2 "Inter"; color: var(--cinza); }
      .chips { margin-top: 26px; display: flex; gap: 16px; }
      .chips span { padding: 14px 22px; border-radius: 18px; font: 800 40px "Inter"; }
      .ok { background: #dff5e6; color: var(--verde); } .no { background: #fde3e4; color: var(--verm); }
      .passos { position: absolute; left: 60px; right: 60px; top: 1300px; display: flex; gap: 18px; }
      .passos div { flex: 1; padding: 20px; border-radius: 24px; background: var(--lima); font: 800 34px/1.15 "Inter"; }
      .passos small { display: block; font: 800 24px "Inter"; letter-spacing: 0.1em; color: #0e1424aa; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <section class="clip" data-start="0" data-duration="1">
        <img class="fundo" src="assets/img/fundo.jpg" alt="" />
        <div class="veu"></div>
        <p class="serie">IA POR SETOR · <b>01 FINANCEIRO</b></p>
        <img id="marca" src="assets/marca/logo-branca.png" alt="" />
        <div class="card">
          <h1>Conciliação bancária em <em>minutos</em> com o Claude</h1>
          <p>142 lançamentos cruzados. O que não bateu, explicado.</p>
          <div class="chips"><span class="ok">140 bateram</span><span class="no">4 não</span></div>
        </div>
        <div class="passos"><div><small>PASSO 1</small>Exporta</div><div><small>PASSO 2</small>Cola o pedido</div><div><small>PASSO 3</small>Revisa e assina</div></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true }); tl.set({}, {}, 1); window.__timelines["main"] = tl;
    </script>
  </body>
</html>
