<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Capa · Case Chewy</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/fonts/inter-700.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-800.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); }

      /* Zona segura: tudo que importa fica entre y=285 e y=1635 (recorte 4:5 do feed).
         A grade do perfil (3:4) corta menos: y=240 a 1680. Os botões do Reels cobrem ~y>1560 à direita. */
      :root { --bg: #0b1020; --ink: #f4f5f8; --lime: #d7ff3a; --red: #ff5a5f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; color: var(--ink); }
      .clip { position: absolute; inset: 0; }
      .foto { position: absolute; left: 0; top: 230px; width: 1080px; height: 1935px; object-fit: cover; display: block; }
      .sombra { position: absolute; inset: 0; background: linear-gradient(180deg, #0b1020 0%, #0b1020 14%, #0b1020b3 28%, #0b102000 40%, #0b102000 56%, #0b1020cc 66%, #0b1020 84%); }

      .topo { position: absolute; left: 70px; right: 70px; top: 320px; display: flex; flex-direction: column; gap: 10px; }
      .kicker { font: 700 30px "Inter"; letter-spacing: 0.16em; color: var(--lime); }
      .numero { display: flex; align-items: baseline; gap: 14px; margin-top: 4px; }
      .moeda { font: 800 92px "Inter"; }
      .valor { font: 800 290px/0.86 "Inter"; letter-spacing: -0.06em; color: var(--lime); }
      .mi { font: 800 120px "Inter"; letter-spacing: -0.04em; }
      .sub { font: italic 400 92px/1 "Instrument Serif"; }
      .frase {
        position: absolute; left: 50px; right: 50px; top: 1150px; padding: 20px 30px; border-radius: 30px;
        background: #0b1020e6; border: 2px solid #ffffff1f; font: 800 70px/1.04 "Inter"; letter-spacing: -0.035em;
      }
      .riscado { position: relative; display: inline-block; color: #ffffffb3; }
      .risco { position: absolute; left: -6px; right: -6px; top: 52%; height: 12px; background: var(--red); border-radius: 6px; display: block; }

      .rosto { position: absolute; left: 70px; top: 1300px; width: 290px; height: 290px; border-radius: 40px; overflow: hidden; border: 6px solid var(--lime); box-shadow: 0 30px 90px #000c; }
      .rosto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 10%; display: block; }
      .selo { position: absolute; left: 400px; top: 1340px; width: 600px; font: 800 58px/1.08 "Inter"; letter-spacing: -0.03em; }
      .selo em { font: italic 400 66px "Instrument Serif"; color: var(--lime); }
      #marca { position: absolute; right: 70px; top: 330px; width: 150px; height: auto; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <section class="clip" data-start="0" data-duration="1">
        <img class="foto" src="assets/img/cachorro.png" alt="" />
        <div class="sombra"></div>
        <div class="topo">
          <span class="kicker">CASO REAL · EUA</span>
          <div class="numero"><span class="moeda">US$</span><span class="valor">50</span><span class="mi">mi</span></div>
          <span class="sub">por ano, com IA</span>
        </div>
        <img id="marca" src="assets/marca/logo-branca.png" alt="" />
        <p class="frase">E o segredo não foi <span class="riscado">a IA.<span class="risco"></span></span></p>
        <div class="rosto"><img src="assets/avatar/rosto-capa.png" alt="" /></div>
        <p class="selo">O que essa empresa fez <em>diferente</em></p>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
