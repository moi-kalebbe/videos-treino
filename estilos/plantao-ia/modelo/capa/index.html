<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Capa · Plantão IA 01</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/fonts/inter-700.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-800.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); }

      /* Zona segura: tudo que importa fica entre y=285 e y=1635 (recorte 4:5 do feed).
         A grade do perfil (3:4) corta menos: y=240 a 1680. Os botões do Reels cobrem ~y>1560 à direita. */
      :root { --bg: #070b18; --ink: #f4f5f8; --red: #e5162e; --lime: #d7ff3a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; color: var(--ink); }
      .clip { position: absolute; inset: 0; }
      .foto { position: absolute; left: 0; top: 380px; width: 1080px; height: 1540px; object-fit: cover; object-position: 50% 20%; display: block; }
      .sombra { position: absolute; inset: 0; background: linear-gradient(180deg, #070b18 0%, #070b18 24%, #070b1800 36%, #070b1800 56%, #070b18d9 70%, #070b18 86%); }

      .topo { position: absolute; left: 70px; right: 70px; top: 310px; }
      .selo { display: inline-flex; align-items: center; gap: 16px; padding: 14px 26px; background: var(--red); border-radius: 14px; font: 800 64px "Inter"; letter-spacing: 0.04em; }
      .selo i { width: 26px; height: 26px; border-radius: 50%; background: #fff; display: block; }
      .edicao { margin-top: 18px; font: 700 32px "Inter"; letter-spacing: 0.16em; color: #ffffffcc; }
      #marca { position: absolute; right: 70px; top: 330px; width: 150px; height: auto; display: block; }

      .manchete { position: absolute; left: 50px; right: 50px; top: 1130px; }
      .manchete .tipo { display: inline-block; padding: 10px 22px; border-radius: 12px 12px 0 0; background: #e08a00; font: 800 34px "Inter"; letter-spacing: 0.08em; }
      .manchete .faixa { background: #fff; color: #0b0f1d; border-radius: 0 20px 20px 20px; padding: 22px 30px; font: 800 66px/1.04 "Inter"; letter-spacing: -0.035em; }
      .manchete .faixa em { font: italic 400 74px "Instrument Serif"; color: var(--red); letter-spacing: 0; }

      .rosto { position: absolute; left: 70px; top: 1400px; width: 210px; height: 210px; border-radius: 34px; overflow: hidden; border: 6px solid var(--red); box-shadow: 0 30px 90px #000c; }
      .rosto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 10%; display: block; }
      .mais { position: absolute; left: 310px; top: 1430px; width: 560px; font: 800 44px/1.12 "Inter"; letter-spacing: -0.02em; }
      .mais em { font: italic 400 52px "Instrument Serif"; color: var(--lime); letter-spacing: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <section class="clip" data-start="0" data-duration="1">
        <img class="foto" src="assets/img/pedreiro.png" alt="" />
        <div class="sombra"></div>
        <div class="topo">
          <span class="selo"><i></i>PLANTÃO IA</span>
          <p class="edicao">EDIÇÃO 01 · 18 DE OUTUBRO</p>
        </div>
        <img id="marca" src="assets/marca/logo-branca.png" alt="" />
        <div class="manchete">
          <span class="tipo">🤦 INUSITADO</span>
          <p class="faixa">Viajou 2 mil km pela namorada. <em>Ela era IA.</em></p>
        </div>
        <div class="rosto"><img src="assets/avatar/rosto-capa.png" alt="" /></div>
        <p class="mais">+ 5 notícias de IA <em>da semana</em></p>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
