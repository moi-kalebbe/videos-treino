    <script>
      const PALAVRAS = window.LEGENDA || [];
      const C = window.CENAS;
      const DURACAO = 91.8;
      const limpar = (s) => s.toLowerCase().replace(/[.,?!:;…]/g, "");
      function em(palavra, n = 1, fallback = 0) {
        let visto = 0;
        for (const p of PALAVRAS) if (limpar(p.w) === palavra && ++visto === n) return p.s;
        return fallback;
      }
      const tl = gsap.timeline({ paused: true });

      // ---- texto palavra a palavra ----
      // 1º ato (história, até "Ele não respondeu"): serifa itálica, palavras douradas. Da virada em diante: Anton, vermelho.
      const DOURADAS = new Set(["combustível#1", "furo#1", "novinho#1", "sessenta#1", "casa#1", "param#1", "apagam#1", "vento#1", "planador#1", "dezessete#1", "aérea#1", "para#1", "morreu#1"]);
      const VERMELHAS = new Set(["combustível#2", "novo#2", "velha#1", "treinou#1", "antigo#1", "metade#1", "inteligência#1", "artificial#1", "moderna#1", "antigo#2", "conferir#1", "nova#2", "velho#1", "para#2", "avião#8"]);
      const VIRADA = 11;
      const CENTRO = new Set([11]);
      const SEM_TEXTO = new Set([20]);
      const caixa = document.getElementById("texto");
      const cenaDe = (t) => { let i = 0; while (i + 1 < C.length && C[i + 1] <= t + 0.01) i++; return i; };
      const contagem = {};
      const grupos = [];
      let atual = [];
      const fecha = () => {
        const n = atual.length, partes = Math.ceil(n / 4), tam = Math.ceil(n / partes);
        for (let i = 0; i < n; i += tam) grupos.push(atual.slice(i, i + tam));
        atual = [];
      };
      PALAVRAS.forEach((p, k) => {
        const prox = PALAVRAS[k + 1];
        atual.push(p);
        if (/[.,?!:…]$/.test(p.w) || !prox || cenaDe(prox.s) !== cenaDe(p.s)) fecha();
      });
      for (const g of grupos) {
        const cena = cenaDe(g[0].s);
        const suave = cena < VIRADA;
        const div = document.createElement("div");
        div.className = "frase " + (suave ? "suave" : CENTRO.has(cena) ? "centro" : "baixo");
        if (!SEM_TEXTO.has(cena)) caixa.appendChild(div);
        for (const p of g) {
          const w = limpar(p.w);
          contagem[w] = (contagem[w] || 0) + 1;
          if (SEM_TEXTO.has(cena)) continue;
          const s = document.createElement("span");
          s.textContent = p.w.replace(/[.,:;…]/g, "");
          const marca = `${w}#${contagem[w]}`;
          if ((suave && DOURADAS.has(marca)) || (!suave && VERMELHAS.has(marca))) s.classList.add("chave");
          div.appendChild(s);
          if (suave) tl.fromTo(s, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, p.s - 0.05);
          else tl.fromTo(s, { opacity: 0, scale: 1.35, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, p.s - 0.03);
        }
        if (SEM_TEXTO.has(cena)) continue;
        const ultimo = g[g.length - 1];
        const proximo = PALAVRAS[PALAVRAS.indexOf(ultimo) + 1];
        const some = proximo ? Math.min(ultimo.e + (suave ? 0.9 : 0.6), proximo.s - 0.02) : ultimo.e + 0.8;
        tl.set(div, { opacity: 1 }, g[0].s - 0.05);
        if (suave) tl.to(div, { opacity: 0, duration: 0.25 }, some - 0.2); else tl.set(div, { opacity: 0 }, some);
      }

      function preta(ini, fim) { tl.set("#preta", { opacity: 1 }, ini); tl.set("#preta", { opacity: 0 }, fim); }
      function tremor(t) { tl.fromTo("#tremor", { opacity: 0.35 }, { opacity: 0, duration: 0.25 }, t); }

      // câmera lenta nos planos da história (push-in suave)
      document.querySelectorAll("video.vid").forEach((v) => {
        const ini = parseFloat(v.dataset.start), dur = parseFloat(v.dataset.duration);
        if (ini < C[VIRADA]) tl.fromTo(v, { scale: 1.0 }, { scale: 1.08, duration: dur, ease: "none" }, ini);
      });

      const ouro = (sel, a, b) => { tl.fromTo(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, a); tl.to(sel, { opacity: 0, duration: 0.3 }, b - 0.3); };
      function shake(sel, t, n = 8, a = 14) { for (let i = 0; i < n; i++) tl.to(sel, { x: (i % 2 ? -1 : 1) * a * (1 - i / n), y: (i % 3 - 1) * a * 0.6, duration: 0.05 }, t + i * 0.05); tl.to(sel, { x: 0, y: 0, duration: 0.05 }, t + n * 0.05); }
      // selo de história real durante a história
      tl.fromTo("#selo", { opacity: 0 }, { opacity: 1, duration: 0.4 }, C[2]);
      tl.set("#selo", { opacity: 0 }, C[VIRADA]);
      // ponteiro do combustível: F → E no gancho, E piscando na pane, meio tanque na virada, cheio no fim
      const agulha = "#gauge .agulha", rot = document.getElementById("g-rot");
      const gauge = (a, b) => { tl.fromTo("#gauge", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.3 }, a); tl.to("#gauge", { opacity: 0, duration: 0.3 }, b - 0.3); };
      tl.set(agulha, { rotation: 80 }, 0);
      gauge(0.05, C[1] + 1.4);
      tl.to(agulha, { rotation: -80, duration: 2.6, ease: "power2.in" }, 0.4);
      tl.set(rot, { innerHTML: "COMBUSTÍVEL" }, 0); tl.set(rot, { innerHTML: "<em>VAZIO</em>" }, 3.0);
      [3.0, 3.4, 3.8].forEach((t) => tremor(t));
      // 4 · motores param: ponteiro no E piscando
      gauge(C[4] + 0.1, C[5]); tl.set(agulha, { rotation: -80 }, C[4]); tl.set(rot, { innerHTML: "<em>SEM COMBUSTÍVEL</em>" }, C[4]);
      for (let i = 0; i < 4; i++) tremor(em("param", 1, 19) + i * 0.4);
      ouro("#o-1983", C[2] + 0.2, C[3]);
      ouro("#o-69", C[3] + 0.1, C[4]);
      // 5 · as telas apagam: interferência → preto (silêncio com vento até a cena 6)
      { const t = em("apagam", 1, 23); tl.set("#apagao", { opacity: 1 }, t - 0.2);
        [0, 0.08, 0.16, 0.26].forEach((d, i) => tl.set("#preta", { opacity: i % 2 ? 0 : 1 }, t + d));
        tl.set("#apagao", { opacity: 0 }, t + 0.35); preta(t + 0.35, C[6]); }
      ouro("#o-17", em("dezessete", 1, 33) - 0.1, C[8]);
      // 9 · nariz bate e arrasta
      shake("#v-g09", em("nariz", 1, 39), 14, 16); tremor(em("para", 1, 41));
      // 10 · ninguém morreu
      ouro("#o-0", em("morreu", 1, 43) - 0.05, em("morreu", 1, 43) + 0.6);
      // 11 · virada: preto + Anton no centro
      preta(em("morreu", 1, 43) + 0.6, C[12]); tremor(C[VIRADA] - 0.08);
      // 12 · AVIÃO NOVO / CONTA VELHA
      const duo = (id, w1, n1, w2, n2, fimT) => { const a = em(w1, n1, 0), b = em(w2, n2, 0);
        tl.set(id, { opacity: 1 }, a - 0.1);
        tl.fromTo(id + " div:nth-child(1)", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out" }, a - 0.05);
        tl.fromTo(id + " div:nth-child(2)", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in" }, b - 0.05);
        tremor(b + 0.1); tl.to(id, { opacity: 0, duration: 0.3 }, fimT - 0.3); };
      duo("#duo1", "novo", 2, "velha", 1, C[13]);
      // 14 · menos da metade do que precisava
      gauge(em("metade", 1, 63) - 0.4, C[15]); tl.set(rot, { innerHTML: "MENOS DA <em>METADE</em>" }, C[14]);
      tl.fromTo(agulha, { rotation: -80 }, { rotation: -10, duration: 0.9, ease: "power2.out" }, em("metade", 1, 63) - 0.3);
      // 15 · HOJE
      tremor(C[15] - 0.05);
      // 18 · IA NOVA / PROCESSO VELHO (mesma tela da conta velha)
      duo("#duo2", "nova", 2, "velho", 1, em("motor", 1, 82) - 0.1);
      tremor(em("para", 2, 83));
      // 19 · Eu não vendo avião (preto) → confiro o combustível: ponteiro enche
      preta(C[19], em("confiro", 1, 86) - 0.1);
      gauge(em("combustível", 4, 87) - 0.3, C[20]); tl.set(rot, { innerHTML: "CONFERIDO ✓" }, C[19]);
      tl.fromTo(agulha, { rotation: -80 }, { rotation: 80, duration: 1.0, ease: "power2.out" }, em("combustível", 4, 87) - 0.2);
      // 20 · CTA
      tl.set("#cta", { opacity: 1 }, C[20]);
      { const chave = "DIAGNÓSTICO"; const dig = document.getElementById("digitado");
        for (let i = 0; i <= chave.length; i++) tl.set(dig, { textContent: chave.slice(0, i) }, em("diagnóstico", 1, 88) - 0.1 + i * 0.05); }
      tl.fromTo(["#cta .assina", "#cta .serie", "#cta img"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.15 }, C[20] + 1.2);
      tl.set("#marca", { opacity: 0 }, C[20]);

      // ---- grão de filme vivo ----
      for (let t = 0, k = 0; t < DURACAO; t += 1 / 24, k++) {
        tl.set("#grao", { backgroundPosition: `${(k * 137) % 540}px ${(k * 311) % 960}px` }, t);
      }

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
