<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Capa · A escala nova e a IA</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/fonts/inter-700.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-800.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("assets/fonts/jbmono-500.woff2") format("woff2"); }
      /* Zona segura: tudo que importa entre y=285 e y=1635 (recorte 4:5 do feed). */
      :root { --branco: #f7f9ff; --azul: #3b74ff; --folga: #1fd1a5; --amarelo: #ffd84a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070a12; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--branco); font-family: "Inter", sans-serif; }
      .clip { position: absolute; inset: 0; }
      .fundo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(0.9) brightness(0.8); }
      .sombra { position: absolute; inset: 0; background: linear-gradient(180deg, #070a12 0%, #070a12cc 14%, #070a1240 34%, #070a1240 50%, #070a12d8 70%, #070a12 92%); }
      .serie { position: absolute; left: 70px; top: 320px; font: 500 32px "JetBrains Mono"; letter-spacing: 0.2em; }
      .serie b { color: var(--amarelo); font-weight: 500; }
      #marca { position: absolute; right: 70px; top: 306px; width: 120px; opacity: 0.9; }
      .titulo { position: absolute; left: 60px; right: 60px; top: 420px; font: 400 150px/0.93 "Anton"; text-transform: uppercase; text-shadow: 0 8px 40px #000; }
      .titulo em { font-style: normal; color: var(--amarelo); }
      .semana { position: absolute; left: 70px; right: 70px; top: 1190px; padding: 26px 26px 30px; border-radius: 30px; background: rgba(14, 20, 38, 0.6); border: 2px solid #ffffff30; backdrop-filter: blur(16px); }
      .semana p.t { font: 500 26px "JetBrains Mono"; letter-spacing: 0.14em; color: #f7f9ffb0; }
      .dias { margin-top: 18px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
      .dias b { height: 120px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font: 800 28px "Inter"; background: var(--azul); }
      .dias b.f { background: var(--folga); color: #06231b; }
      .semana .h { margin-top: 18px; display: flex; justify-content: space-between; align-items: baseline; font: 700 34px "Inter"; }
      .semana .h span { font: 400 64px "Anton"; color: var(--amarelo); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <section class="clip" data-start="0" data-duration="1">
        <img class="fundo" src="assets/img/fundo.jpg" alt="" />
        <div class="sombra"></div>
        <p class="serie">PASSO A PASSO NO <b>CLAUDE</b></p>
        <img id="marca" src="assets/marca/logo-branca.png" alt="" />
        <p class="titulo">Monte a escala nova <em>em 10 minutos</em></p>
        <div class="semana">
          <p class="t">A SEMANA COM A NOVA LEI</p>
          <div class="dias"><b>SEG</b><b>TER</b><b>QUA</b><b>QUI</b><b>SEX</b><b class="f">SÁB</b><b class="f">DOM</b></div>
          <p class="h">2 folgas por semana <span>42h → 40h</span></p>
        </div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
