<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Olha Isso 01 v2 · Tesla Roadster (modelo Joel Jota)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      /* evento por trás, como a câmera de quem está na plateia */
      #fundo { position: absolute; left: -40px; top: -60px; width: 1160px; height: 2040px; object-fit: cover; }
      /* selfie: cabeça e ombros no canto de baixo à direita, como o Joel */
      #selfie { position: absolute; right: -70px; bottom: -10px; width: 700px; height: 875px; object-fit: cover; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.6" data-width="1080" data-height="1920">
      <video id="fundo" src="assets/tesla/fundo-mudo.mp4" muted playsinline data-start="0" data-duration="30.6"></video>
      <video id="selfie" src="assets/avatar/selfie.webm" muted playsinline data-start="0" data-duration="30.23"></video>
      <audio id="narracao" src="assets/audio/narracao.mp3" data-start="0" data-duration="30.23" data-volume="1"></audio>
      <audio id="evento" src="assets/audio/evento.mp3" data-start="0" data-duration="30.6" data-volume="0.22"></audio>
    </div>
    <script>
      const DURACAO = 30.6;
      const tl = gsap.timeline({ paused: true });
      // mão segurando o celular: balanço leve e contínuo no fundo e na selfie
      for (let t = 0, i = 0; t < DURACAO; t += 0.5, i++) {
        const x = Math.sin(i * 1.7) * 14 + Math.sin(i * 0.6) * 10, y = Math.cos(i * 1.3) * 12 + Math.sin(i * 0.4) * 8, r = Math.sin(i * 0.9) * 0.6;
        tl.to("#fundo", { x, y, rotation: r, duration: 0.5, ease: "sine.inOut" }, t);
        tl.to("#selfie", { x: -x * 0.5, y: -y * 0.4, rotation: -r * 0.6, duration: 0.5, ease: "sine.inOut" }, t);
      }
      tl.set({}, {}, DURACAO);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
