    <script>
      const PALAVRAS = window.LEGENDA || [];
      const C = window.CENAS;
      const DURACAO = 117.0;
      const limpar = (s) => s.toLowerCase().replace(/[.,?!:;…]/g, "");
      function em(palavra, n = 1, fallback = 0) {
        let visto = 0;
        for (const p of PALAVRAS) if (limpar(p.w) === palavra && ++visto === n) return p.s;
        return fallback;
      }
      const tl = gsap.timeline({ paused: true });

      // ---- texto palavra a palavra ----
      // 1º ato (história, até "Ele não respondeu"): serifa itálica, palavras douradas. Da virada em diante: Anton, vermelho.
      const DOURADAS = new Set(["família#1", "casamento#1", "escola#1", "avó#1", "kodak#1", "1975#1", "sasson#1", "importância#1", "quilos#1", "cassete#1", "joy#1", "televisão#1", "nenhum#1", "digital#1", "diretoria#1", "bonitinho#1", "ninguém#1"]);
      const VERMELHAS = new Set(["diretoria#2", "pronta#1", "1975#2", "1981#1", "substituir#1", "dez#1", "dez#2", "anos#3", "prazo#1", "prazo#2", "filme#3", "falência#1", "inteligência#1", "artificial#1", "antigo#1", "igualzinho#1", "dez#3", "câmera#4"]);
      const VIRADA = 10;
      const CENTRO = new Set([11, 15, 23]);
      const SEM_TEXTO = new Set([25]);
      const caixa = document.getElementById("texto");
      const cenaDe = (t) => { let i = 0; while (i + 1 < C.length && C[i + 1] <= t + 0.01) i++; return i; };
      const contagem = {};
      const grupos = [];
      let atual = [];
      const fecha = () => {
        const n = atual.length, partes = Math.ceil(n / 4), tam = Math.ceil(n / partes);
        for (let i = 0; i < n; i += tam) grupos.push(atual.slice(i, i + tam));
        atual = [];
      };
      PALAVRAS.forEach((p, k) => {
        const prox = PALAVRAS[k + 1];
        atual.push(p);
        if (/[.,?!:…]$/.test(p.w) || !prox || cenaDe(prox.s) !== cenaDe(p.s)) fecha();
      });
      for (const g of grupos) {
        const cena = cenaDe(g[0].s);
        const suave = cena < VIRADA;
        const div = document.createElement("div");
        div.className = "frase " + (suave ? "suave" : CENTRO.has(cena) ? "centro" : "baixo");
        if (!SEM_TEXTO.has(cena)) caixa.appendChild(div);
        for (const p of g) {
          const w = limpar(p.w);
          contagem[w] = (contagem[w] || 0) + 1;
          if (SEM_TEXTO.has(cena)) continue;
          const s = document.createElement("span");
          s.textContent = p.w.replace(/[.,:;…]/g, "");
          const marca = `${w}#${contagem[w]}`;
          if ((suave && DOURADAS.has(marca)) || (!suave && VERMELHAS.has(marca))) s.classList.add("chave");
          div.appendChild(s);
          if (suave) tl.fromTo(s, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, p.s - 0.05);
          else tl.fromTo(s, { opacity: 0, scale: 1.35, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, p.s - 0.03);
        }
        if (SEM_TEXTO.has(cena)) continue;
        const ultimo = g[g.length - 1];
        const proximo = PALAVRAS[PALAVRAS.indexOf(ultimo) + 1];
        const some = proximo ? Math.min(ultimo.e + (suave ? 0.9 : 0.6), proximo.s - 0.02) : ultimo.e + 0.8;
        tl.set(div, { opacity: 1 }, g[0].s - 0.05);
        if (suave) tl.to(div, { opacity: 0, duration: 0.25 }, some - 0.2); else tl.set(div, { opacity: 0 }, some);
      }

      function preta(ini, fim) { tl.set("#preta", { opacity: 1 }, ini); tl.set("#preta", { opacity: 0 }, fim); }
      function tremor(t) { tl.fromTo("#tremor", { opacity: 0.35 }, { opacity: 0, duration: 0.25 }, t); }

      // câmera lenta nos planos da história (push-in suave)
      document.querySelectorAll("video.vid").forEach((v) => {
        const ini = parseFloat(v.dataset.start), dur = parseFloat(v.dataset.duration);
        if (ini < C[VIRADA]) tl.fromTo(v, { scale: 1.0 }, { scale: 1.08, duration: dur, ease: "none" }, ini);
      });

      const ouro = (sel, a, b) => { tl.fromTo(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, a); tl.to(sel, { opacity: 0, duration: 0.3 }, b - 0.3); };
      function shake(sel, t, n = 8, a = 14) { for (let i = 0; i < n; i++) tl.to(sel, { x: (i % 2 ? -1 : 1) * a * (1 - i / n), y: (i % 3 - 1) * a * 0.6, duration: 0.05 }, t + i * 0.05); tl.to(sel, { x: 0, y: 0, duration: 0.05 }, t + n * 0.05); }
      // selo de história real durante a história
      tl.fromTo("#selo", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
      tl.set("#selo", { opacity: 0 }, C[VIRADA]);
      // flash de câmera nos cliques do álbum
      ["casamento", "escola", "natal"].forEach((p) => tl.fromTo("#tremor", { opacity: 0.55 }, { opacity: 0, duration: 0.3 }, em(p, 1, 5)));
      tl.fromTo("#tremor", { opacity: 0.8 }, { opacity: 0, duration: 0.45 }, em("kodak", 1, 10));
      // 3 · 1975
      ouro("#o-1975", C[3] + 0.1, em("sasson", 1, 16) - 0.3);
      // 4 · 3,6 kg, fita cassete
      ouro("#o-kg", C[4] + 0.3, C[5]);
      tl.fromTo("#tremor", { opacity: 0.6 }, { opacity: 0, duration: 0.3 }, em("foto", 2, 27));
      // 6 · 23 segundos contando → a foto aparece na TV, linha a linha
      { const el = document.getElementById("n-seg"); const o = { v: 0 }; const tv = em("televisão", 1, 33);
        const escreve = () => (el.textContent = Math.round(o.v) + " s");
        tl.set(o, { v: 0, onUpdate: escreve }, 0);
        tl.fromTo("#o-seg", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3 }, C[6]);
        tl.to(o, { v: 23, duration: tv - C[6] - 0.3, ease: "none", onUpdate: escreve }, C[6] + 0.1);
        tl.to("#o-seg", { opacity: 0, duration: 0.2 }, tv - 0.2);
        tl.fromTo("#foto", { opacity: 0 }, { opacity: 1, duration: 0.2 }, tv - 0.1);
        tl.fromTo("#foto .scan", { scaleY: 1 }, { scaleY: 0, duration: 1.6, ease: "steps(24)" }, tv);
        tl.to("#foto", { opacity: 0, duration: 0.3 }, C[8] - 0.3); }
      // 9 · a resposta da diretoria: silêncio, quadro vazio
      // 10 · falsa virada: preto seco + Anton
      preta(C[VIRADA] - 0.4, em("mas", 2, 51) - 0.1);
      tremor(C[VIRADA] - 0.08);
      // 11–12 · 1975 riscado → 1981
      preta(C[11], C[12]);
      { tl.fromTo("#conta", { opacity: 0 }, { opacity: 1, duration: 0.3 }, C[11] + 0.1);
        tl.fromTo("#conta .risco", { scaleX: 0, rotation: -6 }, { scaleX: 1, rotation: -6, duration: 0.25, ease: "power3.out" }, em("1975", 2, 57) + 0.2);
        tl.to("#conta .novo", { opacity: 1, duration: 0.2 }, em("1981", 1, 59) - 0.05);
        tremor(em("1981", 1, 59) - 0.05);
        tl.to("#conta", { opacity: 0, duration: 0.3 }, C[13] - 0.3); }
      // 14 · o prazo: 1981 → 1991 girando
      { const el = document.getElementById("n-anos"); const o = { v: 1981 };
        const escreve = () => (el.textContent = Math.round(o.v));
        tl.set(o, { v: 1981, onUpdate: escreve }, 0);
        tl.fromTo("#o-anos", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3 }, C[14] + 0.2);
        tl.to(o, { v: 1991, duration: C[15] - C[14] - 0.6, ease: "power1.inOut", onUpdate: escreve }, C[14] + 0.4);
        tl.set("#s-anos", { textContent: "DEZ ANOS DE AVISO" }, C[15] - 0.4);
        tl.to("#o-anos", { opacity: 0, duration: 0.2 }, C[15] - 0.05); }
      // 15 · "Dez anos." no preto
      preta(C[15], C[16]); tremor(C[15] - 0.05);
      // 18 · carimbo FALÊNCIA e as luzes da fábrica apagando
      { const t = em("falência", 1, 83); tl.fromTo("#fechado", { opacity: 0, scale: 1.6, rotation: -8 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.18, ease: "power4.in" }, t);
        tremor(t + 0.15); tl.to("#fechado", { opacity: 0, duration: 0.3 }, em("empresa", 2, 85) - 0.4);
        const l = em("empresa", 2, 85) - 0.4; [0, 0.1, 0.25].forEach((d, i) => tl.set("#preta", { opacity: i % 2 ? 0 : 0.7 }, l + d)); tl.set("#preta", { opacity: 0 }, l + 0.35); }
      // 19 · HOJE: corte seco
      tremor(C[19] - 0.05);
      // 23 · Eu não vendo câmera (tela preta)
      preta(C[23], C[24]);
      // 25 · CTA
      tl.set("#cta", { opacity: 1 }, C[25]);
      { const chave = "DIAGNÓSTICO"; const dig = document.getElementById("digitado");
        for (let i = 0; i <= chave.length; i++) tl.set(dig, { textContent: chave.slice(0, i) }, em("diagnóstico", 1, 114) - 0.1 + i * 0.05); }
      tl.fromTo(["#cta .assina", "#cta .serie", "#cta img"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.15 }, C[25] + 1.2);
      tl.set("#marca", { opacity: 0 }, C[25]);

      // ---- grão de filme vivo ----
      for (let t = 0, k = 0; t < DURACAO; t += 1 / 24, k++) {
        tl.set("#grao", { backgroundPosition: `${(k * 137) % 540}px ${(k * 311) % 960}px` }, t);
      }

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
