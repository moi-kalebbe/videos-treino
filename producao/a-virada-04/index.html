    <script>
      const PALAVRAS = window.LEGENDA || [];
      const C = window.CENAS;
      const DURACAO = 81.3;
      const limpar = (s) => s.toLowerCase().replace(/[.,?!:;…]/g, "");
      function em(palavra, n = 1, fallback = 0) {
        let visto = 0;
        for (const p of PALAVRAS) if (limpar(p.w) === palavra && ++visto === n) return p.s;
        return fallback;
      }
      const tl = gsap.timeline({ paused: true });

      // ---- texto palavra a palavra ----
      // 1º ato (história, até "Ele não respondeu"): serifa itálica, palavras douradas. Da virada em diante: Anton, vermelho.
      const DOURADAS = new Set(["faliu#1", "digital#2", "família#1", "casamento#1", "escola#1", "avó#1", "1975#1", "digital#3", "filme#1", "televisão#1", "chefes#1"]);
      const VERMELHAS = new Set(["filme#2", "filme#3", "primeiro#2", "gaveta#1", "antigo#1", "falência#1", "inteligência#1", "artificial#1", "gaveta#2", "planilha#1", "gaveta#3", "concorrente#1", "câmera#5", "gaveta#4"]);
      const VIRADA = 7;
      const CENTRO = new Set([]);
      const SEM_TEXTO = new Set([6, 12, 16]);
      const caixa = document.getElementById("texto");
      const cenaDe = (t) => { let i = 0; while (i + 1 < C.length && C[i + 1] <= t + 0.01) i++; return i; };
      const contagem = {};
      const grupos = [];
      let atual = [];
      const fecha = () => {
        const n = atual.length, partes = Math.ceil(n / 4), tam = Math.ceil(n / partes);
        for (let i = 0; i < n; i += tam) grupos.push(atual.slice(i, i + tam));
        atual = [];
      };
      PALAVRAS.forEach((p, k) => {
        const prox = PALAVRAS[k + 1];
        atual.push(p);
        if (/[.,?!:…]$/.test(p.w) || !prox || cenaDe(prox.s) !== cenaDe(p.s)) fecha();
      });
      for (const g of grupos) {
        const cena = cenaDe(g[0].s);
        const suave = cena < VIRADA;
        const div = document.createElement("div");
        div.className = "frase " + (suave ? "suave" : CENTRO.has(cena) ? "centro" : "baixo");
        if (!SEM_TEXTO.has(cena)) caixa.appendChild(div);
        for (const p of g) {
          const w = limpar(p.w);
          contagem[w] = (contagem[w] || 0) + 1;
          if (SEM_TEXTO.has(cena)) continue;
          const s = document.createElement("span");
          s.textContent = p.w.replace(/[.,:;…]/g, "");
          const marca = `${w}#${contagem[w]}`;
          if ((suave && DOURADAS.has(marca)) || (!suave && VERMELHAS.has(marca))) s.classList.add("chave");
          div.appendChild(s);
          if (suave) tl.fromTo(s, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, p.s - 0.05);
          else tl.fromTo(s, { opacity: 0, scale: 1.35, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, p.s - 0.03);
        }
        if (SEM_TEXTO.has(cena)) continue;
        const ultimo = g[g.length - 1];
        const proximo = PALAVRAS[PALAVRAS.indexOf(ultimo) + 1];
        const some = proximo ? Math.min(ultimo.e + (suave ? 0.9 : 0.6), proximo.s - 0.02) : ultimo.e + 0.8;
        tl.set(div, { opacity: 1 }, g[0].s - 0.05);
        if (suave) tl.to(div, { opacity: 0, duration: 0.25 }, some - 0.2); else tl.set(div, { opacity: 0 }, some);
      }

      function preta(ini, fim) { tl.set("#preta", { opacity: 1 }, ini); tl.set("#preta", { opacity: 0 }, fim); }
      function tremor(t) { tl.fromTo("#tremor", { opacity: 0.35 }, { opacity: 0, duration: 0.25 }, t); }

      // câmera lenta nos planos da história (push-in suave)
      document.querySelectorAll("video.vid").forEach((v) => {
        const ini = parseFloat(v.dataset.start), dur = parseFloat(v.dataset.duration);
        if (ini < C[VIRADA]) tl.fromTo(v, { scale: 1.0 }, { scale: 1.08, duration: dur, ease: "none" }, ini);
      });

      const ouro = (sel, a, b) => { tl.fromTo(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, a); tl.to(sel, { opacity: 0, duration: 0.3 }, b - 0.3); };
      function shake(sel, t, n = 8, a = 14) { for (let i = 0; i < n; i++) tl.to(sel, { x: (i % 2 ? -1 : 1) * a * (1 - i / n), y: (i % 3 - 1) * a * 0.6, duration: 0.05 }, t + i * 0.05); tl.to(sel, { x: 0, y: 0, duration: 0.05 }, t + n * 0.05); }
      // selo de história real durante a história
      tl.fromTo("#selo", { opacity: 0 }, { opacity: 1, duration: 0.4 }, C[1]);
      tl.set("#selo", { opacity: 0 }, C[VIRADA]);
      // 0 · gancho: flash + 1975 → 2012
      tl.fromTo("#tremor", { opacity: 0.85 }, { opacity: 0, duration: 0.5 }, 0.05);
      ouro("#o-gancho", 0.3, C[1]);
      // flash de câmera nos cliques do álbum
      ["casamento", "escola", "natal"].forEach((p) => tl.fromTo("#tremor", { opacity: 0.55 }, { opacity: 0, duration: 0.3 }, em(p, 1, 5)));
      // 3 · 1975, a primeira câmera digital
      ouro("#o-1975", em("1975", 1, 15) - 0.1, C[4]);
      tl.fromTo("#tremor", { opacity: 0.6 }, { opacity: 0, duration: 0.3 }, em("digital", 3, 20));
      // 4 · a foto aparece na televisão, linha a linha
      { const tv = em("televisão", 1, 24); tl.fromTo("#foto", { opacity: 0 }, { opacity: 1, duration: 0.2 }, C[4] + 0.2);
        tl.fromTo("#foto .scan", { scaleY: 1 }, { scaleY: 0, duration: 1.6, ease: "steps(24)" }, tv - 0.3);
        tl.to("#foto", { opacity: 0, duration: 0.3 }, C[5] - 0.2); }
      // citações: a mesma frase em 1975 e hoje (palavra por palavra, mesmo desenho)
      const citacao = (id, cena, vermelhas) => {
        const q = document.querySelector(id + " .q"); const ini = C[cena], fimC = C[cena + 1];
        const ws = PALAVRAS.filter((p) => p.s >= ini - 0.01 && p.s < fimC - 0.01);
        ws.forEach((p) => { const s = document.createElement("span"); s.textContent = p.w + " "; if (vermelhas.includes(limpar(p.w))) s.className = "k"; q.appendChild(s);
          tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.25 }, p.s - 0.05); });
        tl.fromTo(id, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.4 }, ini - 0.3);
        tl.to(id + " .quem", { opacity: 1, duration: 0.3 }, ws[ws.length - 1].e + 0.1);
        tl.to(id, { opacity: 0, duration: 0.3 }, fimC - 0.15); };
      citacao("#cit1", 6, ["ninguém"]);
      citacao("#cit2", 12, ["sempre", "assim"]);
      // 7 · virada: tremor e preto curto no "Sabe por quê?"
      preta(C[VIRADA] - 0.4, em("kodak", 3, 34) - 0.1); tremor(C[VIRADA] - 0.08);
      // 9 · a gaveta fecha
      tremor(C[9] + 3.95);
      // 10 · carimbo FALÊNCIA
      { const t = em("falência", 1, 52); tl.fromTo("#fechado", { opacity: 0, scale: 1.6, rotation: -8 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.18, ease: "power4.in" }, t);
        tremor(t + 0.15); tl.to("#fechado", { opacity: 0, duration: 0.3 }, C[11] - 0.3); }
      // 11 · HOJE
      tremor(C[11] - 0.05);
      tremor(C[13] + 1.75);
      // 15 · Eu não vendo câmera (preto) → a gaveta abre
      preta(C[15], em("ajudo", 1, 75) - 0.1);
      // 16 · CTA
      tl.set("#cta", { opacity: 1 }, C[16]);
      { const chave = "DIAGNÓSTICO"; const dig = document.getElementById("digitado");
        for (let i = 0; i <= chave.length; i++) tl.set(dig, { textContent: chave.slice(0, i) }, em("diagnóstico", 1, 78) - 0.1 + i * 0.05); }
      tl.fromTo(["#cta .assina", "#cta .serie", "#cta img"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.15 }, C[16] + 1.2);
      tl.set("#marca", { opacity: 0 }, C[16]);

      // ---- grão de filme vivo ----
      for (let t = 0, k = 0; t < DURACAO; t += 1 / 24, k++) {
        tl.set("#grao", { backgroundPosition: `${(k * 137) % 540}px ${(k * 311) % 960}px` }, t);
      }

      window.__timelines["main"] = tl;
    </script>
  </body>
