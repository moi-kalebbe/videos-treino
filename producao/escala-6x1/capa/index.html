<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Capa · A Conta 01 · Escala 6x1</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-800.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("assets/fonts/jbmono-500.woff2") format("woff2"); }

      /* Zona segura: tudo que importa entre y=285 e y=1635 (recorte 4:5 do feed). */
      :root { --preto: #0a0705; --branco: #fffaf0; --verm: #ff2b2b; --ambar: #ffc04d; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--preto); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--branco); }
      .clip { position: absolute; inset: 0; }
      .topo { position: absolute; left: 0; top: 240px; width: 1080px; height: 860px; object-fit: cover; object-position: 50% 20%; filter: saturate(1.15) contrast(1.06) sepia(0.1); }
      .base { position: absolute; left: 0; top: 1150px; width: 1080px; height: 770px; object-fit: cover; object-position: 30% 40%; filter: saturate(1.15) contrast(1.06) sepia(0.1) brightness(0.8); }
      .sombra { position: absolute; inset: 0; background:
        linear-gradient(180deg, #0a0705 0px, #0a0705 250px, #0a070500 380px, #0a070500 820px, #0a0705ee 1040px, #0a0705ee 1180px, #0a070588 1330px, #0a070500 1450px, #0a070588 1640px, #0a0705 1820px); }
      .serie { position: absolute; left: 70px; top: 300px; font: 500 34px "JetBrains Mono"; letter-spacing: 0.22em; text-shadow: 0 2px 14px #000; }
      .serie b { color: var(--ambar); font-weight: 500; }
      #marca { position: absolute; right: 70px; top: 290px; width: 130px; opacity: 0.9; }
      .texto { position: absolute; left: 50px; right: 50px; top: 930px; text-align: center; text-shadow: 0 8px 40px #000; }
      .texto .a { display: block; font: 800 92px/1.02 "Inter"; letter-spacing: -0.035em; }
      .texto .b { display: block; margin-top: 18px; font: 400 168px/0.92 "Anton"; color: var(--verm); text-transform: uppercase; }
      .rodape { position: absolute; left: 0; right: 0; top: 1440px; text-align: center; font: 500 34px "JetBrains Mono"; letter-spacing: 0.16em; color: var(--ambar); text-shadow: 0 4px 20px #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <section class="clip" data-start="0" data-duration="1">
        <img class="topo" src="assets/img/topo.png" alt="" />
        <img class="base" src="assets/img/base.jpg" alt="" />
        <div class="sombra"></div>
        <p class="serie">A CONTA · <b>01</b></p>
        <img id="marca" src="assets/marca/logo-branca.png" alt="" />
        <p class="texto"><span class="a">A semana ficou menor.</span><span class="b">O trabalho não.</span></p>
        <p class="rodape">FIM DA 6x1 · 44H → 40H</p>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
