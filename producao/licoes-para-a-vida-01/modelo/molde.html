<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{TITULO_PAGINA}}</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/fonts/inter-700.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-800.woff2") format("woff2"); }
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); }
      :root { --azul: #1f2d55; --creme: #fdf1d6; --coral: #ff7a59; --verde: #2bd38a; --amarelo: #ffd84a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #111; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
      .cena { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; }
      #topo { position: absolute; inset: 0 0 auto 0; height: 760px; background: linear-gradient(180deg, #0d1430f2 0%, #0d1430b0 45%, #0d143000 100%); z-index: 5; }
      #base { position: absolute; inset: auto 0 0 0; height: 1000px; background: linear-gradient(0deg, #0d1430f0 0%, #0d143099 50%, #0d143000 100%); z-index: 5; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 60; }
      #selo { position: absolute; left: 70px; top: 170px; z-index: 30; padding: 12px 24px; border-radius: 40px; background: var(--coral); color: #1b1208; font: 800 30px "Inter"; letter-spacing: 0.06em; }
      /* capa de revista: título atrás do personagem recortado */
      #capa-titulo { position: absolute; left: 40px; right: 40px; top: 290px; z-index: 6; font: 400 158px/0.95 "Anton"; text-transform: uppercase; text-align: center; color: #fff; text-shadow: 0 10px 40px #0007; opacity: 0; }
      #capa-titulo em { position: relative; font-style: normal; color: var(--amarelo); }
      #capa-rec { position: absolute; inset: 0; background: url(assets/img/capa-recorte.png) center / cover; z-index: 7; opacity: 0; }
      .doodle { position: absolute; z-index: 25; overflow: visible; pointer-events: none; }
      .doodle path { fill: none; stroke: var(--amarelo); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      #livro { position: absolute; left: 60px; right: 60px; top: 960px; z-index: 12; padding: 40px 44px 44px; border-radius: 34px; background: var(--creme); color: var(--azul); box-shadow: 0 30px 80px #0009; opacity: 0; }
      #livro .r { font: 800 28px "Inter"; letter-spacing: 0.14em; color: #b4532f; }
      #livro h2 { margin-top: 14px; font: 800 60px/1.08 "Inter"; }
      #livro .autor { margin-top: 16px; font: 700 42px "Inter"; color: #3d4a70; }
      #livro .cap { position: relative; display: inline-block; margin-top: 26px; padding: 14px 26px; border-radius: 18px; background: var(--azul); color: #fff; font: 800 36px/1.25 "Inter"; opacity: 0; }
      #livro .cap .doodle path { stroke: #e2502f; }
      .bolha { position: absolute; z-index: 14; padding: 18px 28px; border-radius: 26px; background: #ffffffe8; color: var(--azul); font: 800 38px "Inter"; box-shadow: 0 16px 40px #0007; opacity: 0; white-space: nowrap; }
      #frase { position: absolute; left: 70px; right: 70px; top: 1060px; z-index: 12; font: 400 96px/1.04 "Anton"; text-transform: uppercase; text-shadow: 0 8px 30px #000a; opacity: 0; }
      #frase em { font-style: normal; color: var(--verde); }
      .cartao { position: absolute; left: 60px; right: 60px; top: 920px; z-index: 12; padding: 34px 40px; border-radius: 30px; background: #fffaf0f2; color: var(--azul); box-shadow: 0 24px 70px #0008; opacity: 0; }
      .cartao h3 { font: 400 70px/1 "Anton"; text-transform: uppercase; color: #c9502b; margin-bottom: 10px; }
      .passo { position: relative; display: flex; gap: 20px; margin-top: 18px; opacity: 0; }
      .passo i { flex: none; position: relative; width: 64px; height: 64px; border-radius: 50%; background: var(--azul); color: #fff; font: 800 36px/64px "Inter"; font-style: normal; text-align: center; }
      .passo i b { position: absolute; inset: 0; border-radius: 50%; background: #1a9a5e; font: 800 40px/64px "Inter"; transform: scale(0); }
      .passo p { font: 800 44px/1.18 "Inter"; padding-top: 4px; }
      .passo .marca { position: relative; display: inline-block; }
      /* visor de câmera (para o teste da câmera) */
      #visor { position: absolute; left: 50px; right: 50px; top: 150px; bottom: 360px; z-index: 15; opacity: 0; pointer-events: none; }
      #visor i { position: absolute; width: 110px; height: 110px; border: 0 solid #fff; }
      #visor .c1 { left: 0; top: 0; border-top-width: 10px; border-left-width: 10px; }
      #visor .c2 { right: 0; top: 0; border-top-width: 10px; border-right-width: 10px; }
      #visor .c3 { left: 0; bottom: 0; border-bottom-width: 10px; border-left-width: 10px; }
      #visor .c4 { right: 0; bottom: 0; border-bottom-width: 10px; border-right-width: 10px; }
      #visor .rec { position: absolute; left: 40px; top: 36px; font: 800 48px "Inter"; color: #fff; text-shadow: 0 2px 10px #000; }
      #visor .rec b { color: #ff3b3b; }
      #visor .tc { position: absolute; right: 40px; top: 36px; font: 800 48px "Inter"; color: #fff; text-shadow: 0 2px 10px #000; }
      .bolha.flutua { background: none; box-shadow: none; padding: 0; font: 400 150px/1 "Anton"; color: #ff4a3a; text-transform: uppercase; text-shadow: 0 0 24px #000c, 3px 0 0 #2bd38a80, -3px 0 0 #3b74ff80; }
      #legenda { position: absolute; left: 60px; right: 60px; top: 1450px; z-index: 40; }
      #legenda p { position: absolute; left: 0; right: 0; text-align: center; font: 800 64px/1.15 "Inter"; text-shadow: 0 4px 18px #000, 0 0 3px #000; opacity: 0; }
      #legenda p b { color: var(--amarelo); }
      #resumo { position: absolute; left: 60px; right: 60px; top: 880px; z-index: 12; padding: 34px 40px; border-radius: 30px; background: #0d1430e0; border: 3px solid #ffffff55; backdrop-filter: blur(18px); opacity: 0; }
      #resumo p { font: 800 44px/1.25 "Inter"; margin: 6px 0; opacity: 0; }
      #resumo p span { color: var(--verde); }
      #amanha { position: absolute; left: 60px; right: 60px; top: 880px; z-index: 13; padding: 34px 40px 40px; border-radius: 30px; background: var(--creme); color: var(--azul); box-shadow: 0 30px 80px #0009; opacity: 0; }
      #amanha .r { font: 800 28px "Inter"; letter-spacing: 0.14em; color: #b4532f; }
      #amanha h4 { margin-top: 10px; font: 400 88px/1 "Anton"; text-transform: uppercase; }
      #amanha .t { margin-top: 14px; font: 800 42px/1.2 "Inter"; }
      #amanha .a { margin-top: 8px; font: 700 34px "Inter"; color: #3d4a70; }
      #seguir, #proximo { position: absolute; left: 50%; top: 1500px; z-index: 13; width: 680px; margin-left: -340px; height: 120px; border-radius: 28px; background: #0095f6; font: 800 48px/120px "Inter"; text-align: center; opacity: 0; }
      #proximo { background: #ffffff; color: var(--azul); }
      #seguir.ok { background: #2a2a31; }
      #toque { position: absolute; left: 680px; top: 1540px; z-index: 14; width: 96px; height: 96px; border-radius: 50%; border: 6px solid #fff; background: #ffffff40; opacity: 0; }
      {{CSS_EXTRA}}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURACAO}}" data-width="1080" data-height="1920">
{{CENAS}}
      <div id="topo"></div><div id="base"></div>
      <p id="selo">{{SELO}}</p>
      {{LIVRO}}
      {{VISOR}}
{{OVERLAYS}}
      {{FRASE}}
      {{PASSOS}}
      {{RESUMO}}
      {{FIM}}
      <div id="legenda"></div>
      <div id="flash"></div>
{{AUDIOS}}
{{SONS}}
    </div>
    <script>
      const PALAVRAS = {{PALAVRAS}};
      const CFG = {{CFG}};
      const DURACAO = {{DURACAO}};
      const limpar = (s) => s.toLowerCase().replace(/[.,?!:;"…]/g, "");
      function em(p, n = 1) { let v = 0; for (const w of PALAVRAS) if (limpar(w.w) === p && ++v === n) return w.s; return 0; }
      function ultimo(p) { let s = 0; for (const w of PALAVRAS) if (limpar(w.w) === p) s = w.s; return s; }
      const T = (x) => (Array.isArray(x) ? em(x[0], x[1] || 1) + (x[2] || 0) : x);
      const tl = gsap.timeline({ paused: true });
      const entra = (el, t, y = 40) => tl.fromTo(el, { opacity: 0, y }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.5)", immediateRender: false }, t);
      const sai = (el, t) => tl.to(el, { opacity: 0, y: -30, duration: 0.25 }, t - 0.25);
      const rabisca = (el, t, d = 0.45) => { const L = el.getTotalLength ? el.getTotalLength() : 1200;
        tl.set(el, { strokeDasharray: L, strokeDashoffset: L }, 0);
        tl.to(el, { strokeDashoffset: 0, duration: d, ease: "power2.out" }, t);
        for (let k = 0; k < 24; k++) tl.set(el, { x: (k % 3) - 1, y: ((k + 1) % 3) - 1, rotation: k % 2 ? 0.6 : -0.6 }, t + d + k * 0.1); };

      // cenas em tela cheia: Ken Burns alternado e corte com cortina
      const temResumo = (CFG.resumo || []).length > 0;
      const tCard = T(CFG.fim.entra);
      const tFim = temResumo ? ultimo("então") : tCard - 0.3;
      const inicio = CFG.cenas.map((c, i) => (i === 0 ? 0 : T(c.entra) - 0.1));
      CFG.cenas.forEach((c, i) => { const el = document.getElementById("cena" + i); const t = inicio[i]; const fim = i + 1 < inicio.length ? inicio[i + 1] : DURACAO;
        tl.set(el, { opacity: 1 }, t);
        tl.fromTo(el, { scale: i % 2 ? 1.16 : 1.04, xPercent: i % 2 ? -2 : 2 }, { scale: i % 2 ? 1.04 : 1.16, xPercent: i % 2 ? 2 : -2, duration: fim - t + 0.3, ease: "none", immediateRender: false }, t);
        if (i) tl.fromTo(el, { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.35, ease: "power3.out", immediateRender: false }, t);
        if (c.zoom) tl.to(el, { scale: c.zoom.escala, transformOrigin: c.zoom.origem, duration: c.zoom.duracao || 0.25, ease: "power3.out" }, T(c.zoom.palavra) - 0.15);
        if (i + 1 < inicio.length) tl.set(el, { opacity: 0 }, fim + 0.36); });

      const M0 = CFG.momentos || {};
      // abertura: título atrás do personagem
      tl.set("#capa-rec", { opacity: 1 }, 0);
      tl.fromTo("#capa-rec", { scale: 1.04, xPercent: 2 }, { scale: 1.16, xPercent: -2, duration: inicio[1] + 0.3, ease: "none", immediateRender: false }, 0);
      tl.fromTo("#capa-titulo", { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.in", immediateRender: false }, 0.05);
      tl.fromTo("#flash", { opacity: 0.6 }, { opacity: 0, duration: 0.3, immediateRender: false }, 0.35);
      tl.set(["#capa-rec", "#capa-titulo"], { opacity: 0 }, inicio[1] + 0.36);
      tl.to("#capa-titulo", { opacity: 0, duration: 0.2 }, Math.min(inicio[1] + 0.15, M0.livro ? T(M0.livro) - 0.25 : 999));

      // livro com título, autor e capítulo
      const M = CFG.momentos || {};
      if (document.getElementById("livro")) {
        entra("#livro", T(M.livro) - 0.2, 60);
        entra("#livro .cap", T(M.capitulo) - 0.1, 20);
        rabisca(document.getElementById("circ-cap"), T(M.capitulo) + 0.5, 0.5);
        sai("#livro", T(M.livro_sai)); }

      // visor de câmera: moldura, REC piscando e relógio correndo
      if (CFG.visor) { const v0 = T(CFG.visor.entra), v1 = T(CFG.visor.sai);
        tl.fromTo("#visor", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, immediateRender: false }, v0);
        tl.to("#selo", { opacity: 0, duration: 0.15 }, v0); tl.to("#selo", { opacity: 1, duration: 0.2 }, v1);
        tl.to("#visor .rec b", { opacity: 0.1, duration: 0.4, yoyo: true, repeat: Math.max(1, Math.floor((v1 - v0) / 0.4) | 1) }, v0 + 0.3);
        const tc = document.querySelector("#visor .tc"), o = { s: 0 };
        tl.to(o, { s: v1 - v0, duration: v1 - v0, ease: "none", onUpdate: () => { const t = Math.floor(o.s); tc.textContent = "15:15:" + String(4 + t).padStart(2, "0"); } }, v0);
        tl.to("#visor", { opacity: 0, duration: 0.2 }, v1 - 0.2); tl.set("#visor", { opacity: 0 }, v1); }
      // balões e selos da cena
      (CFG.overlays || []).forEach((o, i) => { const el = document.getElementById("ov" + i);
        tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, T(o.entra));
        const fimOv = T(o.sai);
        if (o.flutua) { tl.fromTo(el, { x: -380, rotation: -4 }, { x: 160, rotation: 3, duration: fimOv - T(o.entra), ease: "none", immediateRender: false }, T(o.entra));
          tl.to(el, { opacity: 0.15, duration: 0.07, yoyo: true, repeat: 9 }, fimOv - 1.0); }
        if (o.pisca) { const vezes = Math.max(1, Math.min(5, Math.floor((fimOv - T(o.entra) - 0.6) / 0.18)));
          tl.to(el, { opacity: 0.35, duration: 0.18, yoyo: true, repeat: vezes % 2 ? vezes : vezes - 1 }, T(o.entra) + 0.3); }
        tl.to(el, { opacity: 0, duration: 0.2 }, fimOv - 0.2);
        tl.set(el, { opacity: 0 }, fimOv); });

      // a ideia em uma frase
      if (CFG.frase) {
        entra("#frase", T(CFG.frase.entra) - 0.15, 40);
        tl.fromTo("#flash", { opacity: 0.3 }, { opacity: 0, duration: 0.3, immediateRender: false }, T(CFG.frase.entra));
        sai("#frase", T(CFG.frase.sai)); }

      // testa hoje: checklist
      if (document.getElementById("hoje")) {
        entra("#hoje", T(M.passos), 40);
        const passos = document.querySelectorAll(".passo");
        CFG.passos.forEach((p, i) => { entra(passos[i], T(p.entra) - 0.1, 24); tl.to(passos[i].querySelector("b"), { scale: 1, duration: 0.25, ease: "back.out(2.5)" }, T(p.check)); });
        if (CFG.circula_passo) rabisca(document.getElementById("circ-passo"), T(CFG.circula_passo.palavra) - 0.05, 0.4);
        sai("#hoje", (CFG.passos_sai ? T(CFG.passos_sai) : tFim) - 0.1); }

      // final: resumo, próxima lição (ou amanhã) e botão
      tl.to("#selo", { opacity: 0, duration: 0.2 }, tFim - 0.2);
      if (temResumo) {
        entra("#resumo", tFim, 40);
        const linhas = document.querySelectorAll("#resumo p");
        linhas.forEach((l, i) => entra(l, tFim + 0.35 + i * 0.9, 16));
        tl.to("#resumo", { opacity: 0, y: -40, duration: 0.25 }, tCard - 0.2); }
      tl.fromTo("#amanha", { opacity: 0, scale: 0.85, rotation: -3 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, tCard - 0.05);
      if (CFG.fim.tipo === "proximo") {
        tl.fromTo("#proximo", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, tCard + 0.6);
        tl.to("#proximo", { x: 18, duration: 0.25, yoyo: true, repeat: 7, ease: "sine.inOut" }, tCard + 1.1);
      } else {
        const tS = T(CFG.fim.seguir);
        tl.fromTo("#seguir", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, tS - 0.15);
        tl.fromTo("#toque", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.25, immediateRender: false }, tCard + 0.85);
        tl.call(() => { const b = document.getElementById("seguir"); b.classList.remove("ok"); b.textContent = "Seguir @moiseskalebbe"; }, null, tCard + 1.099);
        tl.call(() => { const b = document.getElementById("seguir"); b.classList.add("ok"); b.textContent = "Seguindo ✓"; }, null, tCard + 1.1);
        tl.to("#toque", { opacity: 0, duration: 0.25 }, tCard + 1.5);
      }

      // legenda grande (fora da abertura e do cartão final)
      const caixa = document.getElementById("legenda"); let fr = [];
      const fecha = () => { if (!fr.length) return; const ini = fr[0].s;
        if (ini > 0.9 && ini < tCard - 0.3) { const p = document.createElement("p");
          p.innerHTML = fr.map((w) => (CFG.chaves.includes(limpar(w.w)) ? "<b>" + w.w + "</b>" : w.w)).join(" "); caixa.appendChild(p);
          const prox = PALAVRAS[PALAVRAS.indexOf(fr[fr.length - 1]) + 1]; const fim = prox ? Math.min(fr[fr.length - 1].e + 0.3, prox.s - 0.03) : fr[fr.length - 1].e + 0.5;
          tl.fromTo(p, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.1, immediateRender: false }, ini - 0.03); tl.set(p, { opacity: 0 }, Math.min(fim, tCard - 0.2)); }
        fr = []; };
      PALAVRAS.forEach((w, i) => { fr.push(w); if ((/[.?!:…,]$/.test(w.w) && fr.length >= 2) || fr.length >= 4 || !PALAVRAS[i + 1]) fecha(); });

      tl.set({}, {}, DURACAO);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
