<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />

    <title>A Virada · 02 · Seu Antônio</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/legenda.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("assets/fonts/jbmono-500.woff2") format("woff2"); }

      :root { --preto: #050505; --branco: #f2efe8; --vermelho: #e3141b; --ouro: #d9a94a; --ouro2: #fff1c4; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--preto); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--branco); font-family: "Anton", sans-serif; }
      .clip { position: absolute; inset: 0; }
      #preto { background: var(--preto); }
      .vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

      .tela-preta { position: absolute; inset: 0; background: var(--preto); opacity: 0; }
      #sombra { position: absolute; inset: 0; background: linear-gradient(180deg, #050505b3 0%, #05050500 20%, #05050500 52%, #050505e6 80%, #050505 100%); }

      /* texto central palavra a palavra (Hard Copy) */
      #texto { position: absolute; left: 70px; right: 70px; top: 0; height: 1920px; }
      .frase { position: absolute; left: 0; right: 0; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 0 22px; text-align: center; opacity: 0; }
      .frase.baixo { top: 1180px; height: 420px; }
      .frase.centro { top: 700px; height: 520px; }
      .frase span { display: inline-block; font: 400 104px/1.04 "Anton"; text-transform: uppercase; letter-spacing: 0.01em; color: var(--branco); text-shadow: 0 6px 30px #000, 0 0 2px #000; opacity: 0; }
      .frase.centro span { font-size: 150px; }
      .frase span.chave { color: var(--vermelho); }
      .frase.suave { top: 1220px; height: 380px; gap: 0 18px; }
      .frase.suave span { font: italic 400 96px/1.08 "Instrument Serif"; text-transform: none; letter-spacing: 0; color: #f6efe2; }
      .frase.suave span.chave { color: #f0c372; }

      #ilustrativa { position: absolute; left: 70px; top: 230px; padding: 6px 12px; background: #050505b3; font: 500 28px "JetBrains Mono"; letter-spacing: 0.16em; color: #f2efe8; opacity: 0; }

      /* números dourados */
      .ouro { position: absolute; left: 0; right: 0; top: 380px; text-align: center; opacity: 0; }
      .ouro .n { font: 400 260px/0.9 "Anton"; background: linear-gradient(180deg, var(--ouro2) 0%, var(--ouro) 45%, #7a5414 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 12px 40px #000); }
      .ouro .s { display: inline-block; padding: 4px 16px; background: #050505b3; font: 400 60px "Anton"; color: var(--branco); margin-top: 10px; text-shadow: 0 6px 30px #000; }
      .ouro .s em { font-style: normal; color: var(--vermelho); }

      /* carimbo FECHADO */
      #fechado { position: absolute; left: 50%; top: 560px; width: 760px; margin-left: -380px; padding: 18px 0; text-align: center; border: 12px solid var(--vermelho); color: var(--vermelho); font: 400 170px/1 "Anton"; letter-spacing: 0.04em; background: #050505b3; opacity: 0; }

      /* CTA */
      #cta { position: absolute; inset: 0; opacity: 0; background: var(--preto); }
      #cta .pede { position: absolute; left: 0; right: 0; top: 640px; text-align: center; font: 400 120px "Anton"; color: var(--branco); }
      #cta .campo { position: absolute; left: 80px; right: 80px; top: 820px; height: 190px; border: 6px solid var(--vermelho); display: flex; align-items: center; justify-content: center; }
      #cta .campo span { font: 400 132px "Anton"; color: var(--vermelho); letter-spacing: 0.02em; }
      #cta .assina { position: absolute; left: 0; right: 0; top: 1110px; text-align: center; font: italic 400 76px "Instrument Serif"; color: #f2efe8d9; }
      #cta .serie { position: absolute; left: 0; right: 0; top: 1260px; text-align: center; font: 500 30px "JetBrains Mono"; letter-spacing: 0.22em; color: #f2efe899; }
      #cta img { position: absolute; left: 50%; top: 1380px; width: 220px; margin-left: -110px; display: block; }

      /* camadas de filme */
      #grao { position: absolute; inset: -40px; background: url("assets/img/grao.png"); background-size: 540px 960px; opacity: 0.11; mix-blend-mode: overlay; }
      #vinheta { position: absolute; inset: 0; background: radial-gradient(120% 85% at 50% 50%, #0000 55%, #000000c0 100%); }
      #tremor { position: absolute; inset: 0; background: #fff; opacity: 0; mix-blend-mode: overlay; }
      #marca { position: absolute; right: 54px; top: 64px; width: 120px; height: auto; opacity: 0.75; display: block; }
    </style>
  </head>
  <body>

      <video id="v-v-dados" class="vid" src="assets/video/v-dados.mp4" muted playsinline data-sinc="cena:20:0" data-start="79.36" data-duration="2.13"></video>

      <video id="v-b21b" class="vid" src="assets/video/b21b.mp4" muted playsinline data-sinc="palavra:caderno:2:-0.6" data-start="85.7" data-duration="2.2"></video>
      <video id="v-b23" class="vid" src="assets/video/b23.mp4" muted playsinline data-sinc="cena:23:0" data-start="88.89" data-duration="2.22"></video>

      <section id="palco" class="clip" data-start="0" data-duration="95.9" data-track-index="1">
        <div id="sombra"></div>
        <div class="tela-preta" id="preta"></div>
        <div class="ouro" id="o-hora"><div class="n">03:00</div><div class="s">TODO DIA</div></div>

          <p class="pede">COMENTA</p>

      <audio id="narracao" src="assets/audio/narracao.mp3" data-start="0" data-duration="92.68" data-volume="1"></audio>
      <audio id="trilha" src="assets/audio/trilha.mp3" data-start="0" data-duration="95.9" data-volume="0.34" data-fade-out="1.5"></audio>
      <audio id="amb-fogo" src="assets/audio/fogo.mp3" data-start="0" data-duration="15" data-volume="0.2"></audio>
      <audio id="sfx-relogio" src="assets/audio/relogio.mp3" data-sinc="cena:1:0" data-start="6.12" data-duration="3.9" data-volume="0.3"></audio>
      <audio id="sfx-porta" src="assets/audio/porta.mp3" data-sinc="palavra:porta:1:-0.3" data-start="40.75" data-duration="4" data-volume="0.55"></audio>
      <audio id="sfx-coracao" src="assets/audio/coracao.mp3" data-sinc="cena:12:0.8" data-start="51.47" data-duration="2.4" data-volume="0.45"></audio>
      <audio id="sfx-boom-virada" src="assets/audio/boom1.mp3" data-sinc="cena:13:-0.08" data-start="53.76" data-duration="2.78" data-volume="0.85"></audio>
      <audio id="sfx-caneta" src="assets/audio/caneta.mp3" data-sinc="cena:15:0.2" data-start="59.46" data-duration="2.6" data-volume="0.35"></audio>
      <audio id="sfx-caixa" src="assets/audio/caixa.mp3" data-sinc="palavra:sexta:1:0.45" data-start="66.16" data-duration="2.09" data-volume="0.4"></audio>
      <audio id="sfx-caminhao" src="assets/audio/caminhao.mp3" data-sinc="cena:17:0" data-start="66.66" data-duration="4.3" data-volume="0.22"></audio>
      <audio id="sfx-boom-errado" src="assets/audio/boom2.mp3" data-sinc="palavra:errado:1:-0.05" data-start="75.19" data-duration="2.09" data-volume="0.6"></audio>
      <audio id="sfx-riser" src="assets/audio/riser.mp3" data-sinc="cena:19:-4.0" data-start="72.21" data-duration="4.03" data-volume="0.4"></audio>
      <audio id="sfx-boom-hoje" src="assets/audio/boom2.mp3" data-sinc="cena:19:-0.05" data-start="76.16" data-duration="2.09" data-volume="0.85"></audio>
      <audio id="sfx-braam-fim" src="assets/audio/braam.mp3" data-sinc="palavra:primeiro:1:0.5" data-start="90.49" data-duration="4" data-volume="0.4"></audio>
    </div>

    <script>
      const PALAVRAS = window.LEGENDA || [];
      const C = window.CENAS;
      const DURACAO = 95.9;
      const limpar = (s) => s.toLowerCase().replace(/[.,?!:;…]/g, "");
      function em(palavra, n = 1, fallback = 0) {
        let visto = 0;
        for (const p of PALAVRAS) if (limpar(p.w) === palavra && ++visto === n) return p.s;
        return fallback;
      }
      const tl = gsap.timeline({ paused: true });

      // ---- texto palavra a palavra ----
      // 1º ato (história, até "Ele não respondeu"): serifa itálica, palavras douradas. Da virada em diante: Anton, vermelho.
      const DOURADAS = new Set(["rescisão#1", "três#1", "nome#1", "moreninho#1", "viúva#1", "nada#1", "filho#1", "modernizar#1", "economias#1", "perfeita#1", "última#1", "prego#1", "culpa#1", "respondeu#1"]);
      const VERMELHAS = new Set(["filho#4", "máquina#2", "pão#4", "fiado#1", "ninguém#1", "sexta#1", "ninguém#2", "errado#1", "nome#2", "inteligência#1", "artificial#1", "caderno#2", "máquina#6", "caderno#3"]);
      const VIRADA = 13;
      const CENTRO = new Set([13, 20, 22]);
      const SEM_TEXTO = new Set([24]);
      const caixa = document.getElementById("texto");
      const cenaDe = (t) => { let i = 0; while (i + 1 < C.length && C[i + 1] <= t + 0.01) i++; return i; };
      const contagem = {};
      const grupos = [];
      let atual = [];
      const fecha = () => {
        const n = atual.length, partes = Math.ceil(n / 4), tam = Math.ceil(n / partes);
        for (let i = 0; i < n; i += tam) grupos.push(atual.slice(i, i + tam));
        atual = [];
      };
      PALAVRAS.forEach((p, k) => {
        const prox = PALAVRAS[k + 1];
        atual.push(p);
        if (/[.,?!:…]$/.test(p.w) || !prox || cenaDe(prox.s) !== cenaDe(p.s)) fecha();
      });
      for (const g of grupos) {
        const cena = cenaDe(g[0].s);
        const suave = cena < VIRADA;
        const div = document.createElement("div");
        div.className = "frase " + (suave ? "suave" : CENTRO.has(cena) ? "centro" : "baixo");
        if (!SEM_TEXTO.has(cena)) caixa.appendChild(div);
        for (const p of g) {
          const w = limpar(p.w);
          contagem[w] = (contagem[w] || 0) + 1;
          if (SEM_TEXTO.has(cena)) continue;
          const s = document.createElement("span");
          s.textContent = p.w.replace(/[.,:;…]/g, "");
          const marca = `${w}#${contagem[w]}`;
          if ((suave && DOURADAS.has(marca)) || (!suave && VERMELHAS.has(marca))) s.classList.add("chave");
          div.appendChild(s);
          if (suave) tl.fromTo(s, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, p.s - 0.05);
          else tl.fromTo(s, { opacity: 0, scale: 1.35, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, p.s - 0.03);
        }
        if (SEM_TEXTO.has(cena)) continue;
        const ultimo = g[g.length - 1];
        const proximo = PALAVRAS[PALAVRAS.indexOf(ultimo) + 1];
        const some = proximo ? Math.min(ultimo.e + (suave ? 0.9 : 0.6), proximo.s - 0.02) : ultimo.e + 0.8;
        tl.set(div, { opacity: 1 }, g[0].s - 0.05);
        if (suave) tl.to(div, { opacity: 0, duration: 0.25 }, some - 0.2); else tl.set(div, { opacity: 0 }, some);
      }

      function preta(ini, fim) { tl.set("#preta", { opacity: 1 }, ini); tl.set("#preta", { opacity: 0 }, fim); }
      function tremor(t) { tl.fromTo("#tremor", { opacity: 0.35 }, { opacity: 0, duration: 0.25 }, t); }

      // câmera lenta nos planos da história (push-in suave)
      document.querySelectorAll("video.vid").forEach((v) => {
        const ini = parseFloat(v.dataset.start), dur = parseFloat(v.dataset.duration);
        if (ini < C[VIRADA]) tl.fromTo(v, { scale: 1.0 }, { scale: 1.08, duration: dur, ease: "none" }, ini);
      });

      // selo de história ilustrativa durante a história
      tl.fromTo("#ilustrativa", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
      tl.set("#ilustrativa", { opacity: 0 }, C[VIRADA]);
      // 1 · 03:00, todo dia
      tl.fromTo("#o-hora", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5 }, C[1] + 0.2);
      tl.to("#o-hora", { opacity: 0, duration: 0.4 }, C[2] - 0.4);
      // 12 · "Ele não respondeu." → silêncio → tela preta e virada seca
      preta(C[VIRADA] - 0.35, C[VIRADA + 1]);
      tremor(C[VIRADA] - 0.08);
      // 17 · fornecedor +4% ao mês → +60% em um ano
      { const el = document.getElementById("n-forn"); const o = { v: 0 };
        const escreve = () => (el.textContent = `+${Math.round(o.v)}%`);
        tl.set(o, { v: 0, onUpdate: escreve }, 0);
        tl.fromTo("#o-forn", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.25 }, em("quatro", 1, 67.5) - 0.2);
        tl.to(o, { v: 4, duration: 0.6, ease: "power2.out", onUpdate: escreve }, em("quatro", 1, 67.5));
        tl.to(o, { v: 60, duration: 1.2, ease: "power2.in", onUpdate: escreve }, em("via", 1, 70) - 0.6);
        tl.set("#s-forn", { textContent: "AO MÊS" }, 0);
        tl.set("#s-forn", { textContent: "EM UM ANO" }, em("via", 1, 70) - 0.6);
        tl.set("#o-forn", { opacity: 0 }, C[18]); }
      // 19 · HOJE: corte seco
      tremor(C[19] - 0.05);
      // 22 · Eu não vendo máquina (tela preta)
      preta(C[22], C[23]);
      // 24 · CTA
      tl.set("#cta", { opacity: 1 }, C[24]);
      { const chave = "DIAGNÓSTICO"; const dig = document.getElementById("digitado");
        for (let i = 0; i <= chave.length; i++) tl.set(dig, { textContent: chave.slice(0, i) }, em("diagnóstico", 1, 91.8) - 0.1 + i * 0.05); }
      tl.fromTo(["#cta .assina", "#cta .serie", "#cta img"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.15 }, C[24] + 1.2);
      tl.set("#marca", { opacity: 0 }, C[24]);

      // ---- grão de filme vivo ----
      for (let t = 0, k = 0; t < DURACAO; t += 1 / 24, k++) {
        tl.set("#grao", { backgroundPosition: `${(k * 137) % 540}px ${(k * 311) % 960}px` }, t);
      }

      window.__timelines["main"] = tl;
    </script>
